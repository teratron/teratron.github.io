<g inkscape:groupmode="layer" inkscape:label="Notes" id="layer-notes">
<g>
<circle cx="926" cy="142" r="20" fill="#1d2a6d" stroke="#ffffff" stroke-width="2.5"/>
<text x="926" y="150" font-size="23" text-anchor="middle" font-weight="700" fill="#ffffff">1</text>
</g>
<text x="962" y="150" font-size="28" text-anchor="start" font-weight="600" fill="#1d2a6d">Слот ресурса</text>
<text x="962" y="186" font-size="23" text-anchor="start" fill="#1d2a6d">6 штук, на лучах к углам. Кабель идёт от угла базы.</text>
<g>
<circle cx="926" cy="234" r="20" fill="#1d2a6d" stroke="#ffffff" stroke-width="2.5"/>
<text x="926" y="242" font-size="23" text-anchor="middle" font-weight="700" fill="#ffffff">2</text>
</g>
<text x="962" y="242" font-size="28" text-anchor="start" font-weight="600" fill="#1d2a6d">Полоса дороги</text>
<text x="962" y="278" font-size="23" text-anchor="start" fill="#1d2a6d">6 штук, на лучах к серединам граней.</text>
<g>
<circle cx="926" cy="326" r="20" fill="#1d2a6d" stroke="#ffffff" stroke-width="2.5"/>
<text x="926" y="334" font-size="23" text-anchor="middle" font-weight="700" fill="#ffffff">3</text>
</g>
<text x="962" y="334" font-size="28" text-anchor="start" font-weight="600" fill="#1d2a6d">База</text>
<text x="962" y="370" font-size="23" text-anchor="start" fill="#1d2a6d">На гранях 6 ворот, на углах 6 слотов.</text>
<g>
<circle cx="926" cy="418" r="20" fill="#1d2a6d" stroke="#ffffff" stroke-width="2.5"/>
<text x="926" y="426" font-size="23" text-anchor="middle" font-weight="700" fill="#ffffff">4</text>
</g>
<text x="962" y="426" font-size="28" text-anchor="start" font-weight="600" fill="#1d2a6d">Сегмент (зона)</text>
<text x="962" y="462" font-size="23" text-anchor="start" fill="#1d2a6d">Цвет зоны = ресурс, серый = пусто. Форма: гипотеза.</text>
<g>
<circle cx="926" cy="510" r="20" fill="#1d2a6d" stroke="#ffffff" stroke-width="2.5"/>
<text x="926" y="518" font-size="23" text-anchor="middle" font-weight="700" fill="#ffffff">5</text>
</g>
<text x="962" y="518" font-size="28" text-anchor="start" font-weight="600" fill="#1d2a6d">Препятствие</text>
<text x="962" y="554" font-size="23" text-anchor="start" fill="#1d2a6d">Закрывает позиции подряд: здесь 2 слота и полосу.</text>
<g>
<circle cx="926" cy="602" r="20" fill="#1d2a6d" stroke="#ffffff" stroke-width="2.5"/>
<text x="926" y="610" font-size="23" text-anchor="middle" font-weight="700" fill="#ffffff">6</text>
</g>
<text x="962" y="610" font-size="28" text-anchor="start" font-weight="600" fill="#1d2a6d">Дорога игрока</text>
<text x="962" y="646" font-size="23" text-anchor="start" fill="#1d2a6d">Цвет игрока, через ребро уходит к соседу.</text>
</g>
