<text x="1160" y="790" font-size="26" text-anchor="start" font-weight="600" fill="#1d2a6d">Кольцо из 12 позиций:</text>
<text x="1160" y="826" font-size="23" text-anchor="start" fill="#1d2a6d">чётные = слоты,</text>
<text x="1160" y="858" font-size="23" text-anchor="start" fill="#1d2a6d">нечётные = полосы.</text>
<text x="1160" y="894" font-size="23" text-anchor="start" fill="#1d2a6d">На пятиугольнике</text>
<text x="1160" y="926" font-size="23" text-anchor="start" fill="#1d2a6d">планеты их 10.</text>
